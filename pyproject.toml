[project]
name = "digital-creatures"
version = "0.1.0"
description = "Little guys on a grid, evolving under a survival criterion."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "matplotlib>=3.9",
    "numpy>=2.1",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.uv]
# A simulation you run, not a library you install.
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
